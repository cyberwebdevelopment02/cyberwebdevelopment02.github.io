<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Cyber Web Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2136;
    --whitewash:#F6F4EE;
    --whitewash-2:#EEEAE0;
    --brass:#B8863C;
    --brass-light:#D9AE6B;
    --slate:#2B2F36;
    --mist:#C7D2DA;
    --line: rgba(246,244,238,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--slate);
    background:var(--whitewash);
    line-height:1.55;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  h1{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; }
  a{ color:inherit; text-decoration:none; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
  }

  nav{
    background:var(--ink);
    border-bottom:1px solid var(--line);
  }
  nav .navwrap{
    max-width:1120px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between; height:68px;
  }
  .logo{ font-family:'Fraunces', serif; font-size:1.15rem; color:var(--whitewash); font-weight:600; }
  .logo span{ color:var(--brass-light); }
  .back-link{ color:var(--mist); font-size:0.9rem; }
  .back-link:hover{ color:var(--whitewash); }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }
  .login-box{
    background:#fff;
    border:1px solid var(--whitewash-2);
    border-radius:8px;
    padding:44px 40px;
    max-width:420px;
    width:100%;
  }
  .login-box h1{ font-size:1.6rem; margin:10px 0 8px; color:var(--ink); }
  .login-box p{ color:#5a5f66; font-size:0.94rem; margin-bottom:26px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  label{ font-size:0.88rem; font-weight:600; color:var(--ink); }
  input{
    font-family:'Work Sans', sans-serif;
    font-size:0.98rem;
    padding:13px 14px;
    border:1px solid #D9D4C6;
    border-radius:4px;
    background:#fff;
    color:var(--slate);
  }
  input:focus{ outline:none; border-color:var(--brass); }
  .error{
    color:#B33A3A; font-size:0.86rem; margin-top:8px; display:none;
  }
  .error.show{ display:block; }
  .btn{
    display:inline-block; width:100%; margin-top:20px; padding:14px 26px; border-radius:3px;
    font-weight:600; font-size:0.96rem; border:none; cursor:pointer;
    background:var(--brass); color:var(--ink); transition:transform .15s ease;
  }
  .btn:hover{ transform:translateY(-2px); }
  .note{ font-size:0.82rem; color:#8a8f96; margin-top:18px; text-align:center; }
</style>
</head>
<body>

<nav>
  <div class="navwrap">
    <div class="logo">Cyber<span>Web</span> Development</div>
    <a href="index.html" class="back-link">← Retour au site</a>
  </div>
</nav>

<main>
  <div class="login-box">
    <span class="eyebrow">Connexion</span>
    <h1>Accédez à votre espace</h1>
    <p>Entrez votre email pour continuer. Aucun mot de passe requis.</p>
    <form id="login-form">
      <div class="field">
        <label for="login_email">Email</label>
        <input type="email" id="login_email" name="login_email" required placeholder="vous@exemple.com">
      </div>
      <div class="error" id="login-error">Veuillez entrer un email valide.</div>
      <button type="submit" class="btn">Se connecter</button>
    </form>
    <p class="note">En vous connectant, vous pourrez démarrer un projet avec nous.</p>
  </div>
</main>

<script src="auth.js"></script>
<script>
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const emailInput = document.getElementById('login_email');
    const errorBox = document.getElementById('login-error');
    const email = emailInput.value.trim();

    if (!cwdIsValidEmail(email)) {
      errorBox.classList.add('show');
      return;
    }
    errorBox.classList.remove('show');

    cwdLogin(email);

    const params = new URLSearchParams(window.location.search);
    const redirect = params.get('redirect');
    window.location.href = redirect ? redirect : 'index.html';
  });
</script>

</body>
</html>
