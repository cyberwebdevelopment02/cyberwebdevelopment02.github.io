<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos Sites — Admin — Cyber Web Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2136;
    --ink-2:#132C46;
    --atlantic:#1C4870;
    --whitewash:#F6F4EE;
    --whitewash-2:#EEEAE0;
    --brass:#B8863C;
    --brass-light:#D9AE6B;
    --slate:#2B2F36;
    --mist:#C7D2DA;
    --line: rgba(246,244,238,0.14);
    --green:#2E7D46;
    --red:#B33A3A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ font-family:'Work Sans', sans-serif; background:var(--whitewash); color:var(--slate); min-height:100vh; }
  h1{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; color:var(--ink); }
  a{ color:inherit; text-decoration:none; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
  }

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(14,33,54,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .navwrap{
    max-width:1120px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between; height:68px; flex-wrap:wrap; gap:10px;
  }
  .logo{ font-family:'Fraunces', serif; font-size:1.15rem; color:var(--whitewash); font-weight:600; }
  .logo span{ color:var(--brass-light); }
  .admin-links{ display:flex; gap:24px; align-items:center; }
  .admin-links a{ color:var(--mist); font-size:0.88rem; transition:color .2s; }
  .admin-links a:hover{ color:var(--whitewash); }
  .admin-links a.active{ color:var(--brass-light); font-weight:600; }
  .back-link{ color:var(--mist); font-size:0.88rem; }
  .back-link:hover{ color:var(--whitewash); }

  main{ max-width:820px; margin:0 auto; padding:48px 28px 96px; }
  .page-head{ margin-bottom:32px; }
  .page-head h1{ font-size:1.6rem; margin-bottom:6px; }
  .subtitle{ color:#6b7076; font-size:0.94rem; }

  .fb-signin-box{
    max-width:380px; margin:60px auto; border:1px solid var(--whitewash-2); border-radius:8px;
    padding:32px; text-align:left; background:#fff;
  }
  .fb-signin-title{ font-family:'Fraunces', serif; font-weight:500; font-size:1.15rem; color:var(--ink); margin-bottom:6px; }
  .fb-signin-note{ color:#8a8f96; font-size:0.85rem; margin-bottom:18px; }
  .fb-signin-box input{
    width:100%; padding:12px 14px; margin-bottom:10px; border:1px solid #D9D4C6;
    border-radius:4px; font-size:0.94rem; font-family:'Work Sans',sans-serif;
  }
  .fb-signin-box input:focus{ outline:none; border-color:var(--brass); }
  .fb-signin-box button{
    width:100%; padding:12px; border:none; border-radius:4px; background:var(--brass);
    color:var(--ink); font-weight:600; cursor:pointer; font-size:0.94rem; transition:transform .15s ease;
  }
  .fb-signin-box button:hover{ transform:translateY(-2px); }
  .fb-signin-error{ color:var(--red); font-size:0.82rem; margin-top:8px; min-height:1em; }

  .panel{
    background:#fff; border:1px solid var(--whitewash-2); border-radius:6px;
    padding:26px; margin-bottom:28px;
  }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:0.82rem; font-weight:600; color:var(--ink); }
  .field input, .field textarea{
    padding:11px 13px; border:1px solid #D9D4C6; border-radius:4px; font-size:0.9rem;
    font-family:'Work Sans',sans-serif; color:var(--slate);
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--brass); }
  .field.full{ grid-column:1 / -1; }
  .field textarea{ resize:vertical; min-height:60px; }
  .add-btn{
    padding:12px 24px; border:none; border-radius:4px; background:var(--brass); color:var(--ink);
    font-weight:600; cursor:pointer; font-size:0.92rem; transition:transform .15s ease;
  }
  .add-btn:hover{ transform:translateY(-2px); }
  .add-btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }
  .form-error{ color:var(--red); font-size:0.82rem; margin-top:8px; min-height:1em; }

  .note{ font-size:0.82rem; color:#8a8f96; margin-bottom:18px; }

  .site-card{
    background:#fff; border:1px solid var(--whitewash-2); border-radius:6px;
    padding:18px 22px; margin-bottom:12px; display:flex; justify-content:space-between;
    align-items:flex-start; gap:16px; flex-wrap:wrap;
  }
  .site-card .name{ font-family:'Fraunces', serif; font-weight:500; font-size:1.05rem; color:var(--ink); }
  .site-card .url{ font-family:'IBM Plex Mono',monospace; font-size:0.8rem; color:var(--atlantic); }
  .site-card .desc{ color:#5a5f66; font-size:0.88rem; margin-top:6px; max-width:55ch; }
  .site-card .shown-badge{
    display:inline-block; font-size:0.7rem; font-weight:600; padding:2px 9px; border-radius:10px;
    background:var(--whitewash-2); color:var(--green); margin-left:8px;
  }
  .delete-btn{
    padding:8px 14px; border:1px solid var(--whitewash-2); border-radius:4px; background:#fff;
    color:var(--red); font-weight:600; font-size:0.8rem; cursor:pointer; transition:border-color .2s;
    white-space:nowrap;
  }
  .delete-btn:hover{ border-color:var(--red); }
  .empty-state, .error-state{ color:#8a8f96; font-size:0.92rem; padding:20px 4px; }
  .error-state{ color:var(--red); }

  @media (max-width:600px){ .form-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<nav>
  <div class="navwrap">
    <div class="logo">Cyber<span>Web</span> Development</div>
    <span class="admin-links">
      <a href="admin.html">Demandes</a>
      <a href="admin-coupons.html">Coupons</a>
      <a href="admin-utilisateurs.html">Utilisateurs</a>
      <a href="admin-sponsor.html">Sponsor</a>
      <a href="admin-sites.html" class="active">Nos Sites</a>
      <a href="index.html" class="back-link">← Retour au site</a>
    </span>
  </div>
</nav>

<main>
  <div class="page-head">
    <span class="eyebrow">Admin</span>
    <h1>Nos Sites</h1>
    <p class="subtitle">Gérez le portfolio affiché sur la page d'accueil. Les 3 sites les plus récents s'affichent.</p>
  </div>

  <div class="panel">
    <div class="form-row">
      <div class="field">
        <label for="site-name">Nom du client / site</label>
        <input type="text" id="site-name" placeholder="Café Marina">
      </div>
      <div class="field">
        <label for="site-url">Lien du site</label>
        <input type="text" id="site-url" placeholder="https://exemple.com">
      </div>
      <div class="field full">
        <label for="site-desc">Description courte <span style="font-weight:400;color:#8a8f96;">(optionnel)</span></label>
        <textarea id="site-desc" placeholder="Site vitrine une page, livré en 5 jours."></textarea>
      </div>
    </div>
    <button class="add-btn" id="add-btn">Ajouter à la page d'accueil</button>
    <p class="form-error" id="form-error"></p>
  </div>

  <p class="note" id="count-note"></p>
  <div id="sites-root">
    <p class="empty-state">Chargement...</p>
  </div>
</main>

<script src="auth.js?v=8"></script>
<script>
  (function () {
    const email = cwdGetLoggedInEmail();
    if (!email) {
      window.location.href = 'login.html?redirect=admin-sites.html';
      return;
    }
    if (!cwdIsAdmin()) {
      window.location.href = 'index.html';
      return;
    }
  })();
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-firebase.js"></script>
<script>
  (async function () {
    const CWD_ADMIN_EMAIL = 'cyberweb.development02@gmail.com';
    const formErrorEl = document.getElementById('form-error');
    const root = document.getElementById('sites-root');
    const countNote = document.getElementById('count-note');

    // Firebase sign-in guards writes to the "sites" collection (same
    // pattern as admin.html / admin-coupons.html) — needed before we can
    // load or manage the list at all, since the add/delete actions
    // require a real Firebase Auth session.
    const signinHost = document.createElement('div');
    root.parentNode.insertBefore(signinHost, root);
    const existingUser = await cwdFirebaseWaitForAuthState();
    if (!existingUser) {
      await cwdRenderFirebaseSignIn(signinHost, CWD_ADMIN_EMAIL);
    }
    signinHost.remove();

    const nameInput = document.getElementById('site-name');
    const urlInput = document.getElementById('site-url');
    const descInput = document.getElementById('site-desc');
    const addBtn = document.getElementById('add-btn');

    let loadedSites = [];

    loadSites();
    addBtn.addEventListener('click', addSite);

    function normalizeUrl(u) {
      const trimmed = u.trim();
      if (!trimmed) return '';
      if (!/^https?:\/\//i.test(trimmed)) return 'https://' + trimmed;
      return trimmed;
    }

    async function addSite() {
      const name = nameInput.value.trim();
      const url = normalizeUrl(urlInput.value);
      const desc = descInput.value.trim();
      formErrorEl.textContent = '';

      if (!name || !url) {
        formErrorEl.textContent = 'Le nom et le lien sont requis.';
        return;
      }
      try {
        new URL(url);
      } catch (e) {
        formErrorEl.textContent = 'Lien invalide.';
        return;
      }

      addBtn.disabled = true;
      addBtn.textContent = 'Ajout...';
      try {
        await cwdDb.collection('sites').add({
          name: name,
          url: url,
          description: desc,
          created_at: firebase.firestore.FieldValue.serverTimestamp()
        });
        nameInput.value = '';
        urlInput.value = '';
        descInput.value = '';
        loadSites();
      } catch (err) {
        console.error('cwd: erreur ajout site ->', err);
        formErrorEl.textContent = "L'ajout a échoué — vérifiez les règles Firestore.";
      } finally {
        addBtn.disabled = false;
        addBtn.textContent = 'Ajouter à la page d\'accueil';
      }
    }

    async function loadSites() {
      root.innerHTML = '<p class="empty-state">Chargement...</p>';
      try {
        const snap = await cwdDb.collection('sites').orderBy('created_at', 'desc').get();
        loadedSites = [];
        if (snap.empty) {
          countNote.textContent = '';
          root.innerHTML = '<p class="empty-state">Aucun site ajouté pour le moment.</p>';
          return;
        }
        root.innerHTML = '';
        let i = 0;
        snap.forEach(function (doc) {
          const d = doc.data();
          loadedSites.push({ id: doc.id, data: d });
          const shown = i < 3;
          const card = document.createElement('div');
          card.className = 'site-card';
          card.innerHTML =
            '<div>' +
              '<div class="name">' + escapeHtml(d.name || '') +
                (shown ? '<span class="shown-badge">Affiché</span>' : '') +
              '</div>' +
              '<div class="url">' + escapeHtml(d.url || '') + '</div>' +
              (d.description ? '<div class="desc">' + escapeHtml(d.description) + '</div>' : '') +
            '</div>' +
            '<button class="delete-btn" data-id="' + doc.id + '">Supprimer</button>';
          root.appendChild(card);
          i++;
        });
        countNote.textContent = loadedSites.length + ' site(s) au total — les 3 plus récents apparaissent sur la page d\'accueil.';
        root.querySelectorAll('.delete-btn').forEach(function (btn) {
          btn.addEventListener('click', function () { deleteSite(btn.dataset.id); });
        });
      } catch (err) {
        console.error('cwd: erreur chargement sites ->', err);
        root.innerHTML = '<p class="error-state">Impossible de charger les sites. Vérifiez les règles Firestore.</p>';
      }
    }

    async function deleteSite(id) {
      if (!confirm('Retirer ce site du portfolio ?')) return;
      try {
        await cwdDb.collection('sites').doc(id).delete();
        loadSites();
      } catch (err) {
        console.error('cwd: erreur suppression site ->', err);
        alert('La suppression a échoué — vérifiez les règles Firestore.');
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  })();
</script>

</body>
</html>
