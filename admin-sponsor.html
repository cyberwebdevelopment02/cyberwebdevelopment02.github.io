<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sponsor — Admin — Cyber Web Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2136;
    --ink-2:#132C46;
    --atlantic:#1C4870;
    --whitewash:#F6F4EE;
    --whitewash-2:#EEEAE0;
    --brass:#B8863C;
    --brass-light:#D9AE6B;
    --slate:#2B2F36;
    --mist:#C7D2DA;
    --line: rgba(246,244,238,0.14);
    --green:#2E7D46;
    --red:#B33A3A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ font-family:'Work Sans', sans-serif; background:var(--whitewash); color:var(--slate); min-height:100vh; }
  h1{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; color:var(--ink); }
  a{ color:inherit; text-decoration:none; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
  }

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(14,33,54,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .navwrap{
    max-width:1120px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between; height:68px; flex-wrap:wrap; gap:10px;
  }
  .logo{ font-family:'Fraunces', serif; font-size:1.15rem; color:var(--whitewash); font-weight:600; }
  .logo span{ color:var(--brass-light); }
  .admin-links{ display:flex; gap:24px; align-items:center; }
  .admin-links a{ color:var(--mist); font-size:0.88rem; transition:color .2s; }
  .admin-links a:hover{ color:var(--whitewash); }
  .admin-links a.active{ color:var(--brass-light); font-weight:600; }
  .back-link{ color:var(--mist); font-size:0.88rem; }
  .back-link:hover{ color:var(--whitewash); }

  main{ max-width:760px; margin:0 auto; padding:48px 28px 96px; }
  .page-head{ margin-bottom:32px; }
  .page-head h1{ font-size:1.6rem; margin-bottom:6px; }
  .subtitle{ color:#6b7076; font-size:0.94rem; }

  .panel{
    background:#fff; border:1px solid var(--whitewash-2); border-radius:6px;
    padding:26px; margin-bottom:24px;
  }
  .field{ display:flex; flex-direction:column; gap:8px; margin-bottom:16px; }
  .field label{ font-size:0.86rem; font-weight:600; color:var(--ink); }
  .field .hint{ font-size:0.8rem; color:#8a8f96; font-weight:400; }
  textarea{
    width:100%; min-height:160px; padding:14px; border:1px solid #D9D4C6; border-radius:4px;
    font-family:'IBM Plex Mono', monospace; font-size:0.86rem; resize:vertical; color:var(--slate);
  }
  textarea:focus{ outline:none; border-color:var(--brass); }

  .count-row{ display:flex; gap:16px; align-items:center; font-size:0.84rem; color:#5a5f66; margin-bottom:18px; flex-wrap:wrap; }
  .count-row .valid{ color:var(--green); font-weight:600; }
  .count-row .invalid{ color:var(--red); font-weight:600; }
  .invalid-list{ font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--red); margin-top:4px; word-break:break-all; }

  .send-btn{
    padding:13px 26px; border:none; border-radius:4px; background:var(--brass);
    color:var(--ink); font-weight:600; cursor:pointer; font-size:0.94rem; transition:transform .15s ease, opacity .15s ease;
  }
  .send-btn:hover{ transform:translateY(-2px); }
  .send-btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

  .progress-wrap{ margin-top:18px; display:none; }
  .progress-wrap.show{ display:block; }
  .progress-bar-track{ width:100%; height:8px; border-radius:4px; background:var(--whitewash-2); overflow:hidden; }
  .progress-bar-fill{ height:100%; background:var(--brass); width:0%; transition:width .2s ease; }
  .progress-note{ font-size:0.82rem; color:#6b7076; margin-top:8px; }

  .results{ margin-top:18px; font-size:0.86rem; }
  .results .ok{ color:var(--green); font-weight:600; }
  .results .fail{ color:var(--red); font-weight:600; }
  .fail-list{ font-family:'IBM Plex Mono', monospace; font-size:0.78rem; color:var(--red); margin-top:6px; }

</style>
</head>
<body>

<nav>
  <div class="navwrap">
    <div class="logo">Cyber<span>Web</span> Development</div>
    <span class="admin-links">
      <a href="admin.html">Demandes</a>
      <a href="admin-coupons.html">Coupons</a>
      <a href="admin-utilisateurs.html">Utilisateurs</a>
      <a href="admin-sponsor.html" class="active">Sponsor</a>
      <a href="admin-sites.html">Nos Sites</a>
      <a href="index.html" class="back-link">← Retour au site</a>
    </span>
  </div>
</nav>

<main>
  <div class="page-head">
    <span class="eyebrow">Admin</span>
    <h1>Sponsor</h1>
    <p class="subtitle">Collez une liste d'emails, un email de présentation avec un gros bouton vers le site est envoyé à chacun.</p>
  </div>

  <div class="panel" style="margin-top:20px;">
    <div class="field">
      <label for="email-list">Liste d'emails <span class="hint">— un par ligne, ou séparés par des virgules/espaces</span></label>
      <textarea id="email-list" placeholder="contact@entreprise1.com&#10;contact@entreprise2.com&#10;info@entreprise3.com"></textarea>
    </div>
    <div class="count-row" id="count-row">
      <span><span class="valid" id="valid-count">0</span> valide(s)</span>
      <span><span class="invalid" id="invalid-count">0</span> invalide(s)</span>
    </div>
    <div class="invalid-list" id="invalid-list"></div>

    <button class="send-btn" id="sponsor-btn">Sponsor — Envoyer</button>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-bar-fill"></div></div>
      <p class="progress-note" id="progress-note">Envoi en cours...</p>
    </div>

    <div class="results" id="results"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="auth.js?v=8"></script>
<script>
  (function () {
    const email = cwdGetLoggedInEmail();
    if (!email) {
      window.location.href = 'login.html?redirect=admin-sponsor.html';
      return;
    }
    if (!cwdIsAdmin()) {
      window.location.href = 'index.html';
      return;
    }
  })();
</script>

<script>
  // ---- Configure this after creating the EmailJS template (see setup note above) ----
  const CWD_SPONSOR_TEMPLATE_ID = 'template_9rfpn3o';
  const CWD_SITE_LINK = 'https://cyberwebdevelopment02.github.io/';
  const CWD_SEND_DELAY_MS = 600; // spacing between sends, keeps under EmailJS rate limits

  emailjs.init(CWD_EMAILJS_PUBLIC_KEY);

  const textarea = document.getElementById('email-list');
  const validCountEl = document.getElementById('valid-count');
  const invalidCountEl = document.getElementById('invalid-count');
  const invalidListEl = document.getElementById('invalid-list');
  const sponsorBtn = document.getElementById('sponsor-btn');
  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-bar-fill');
  const progressNote = document.getElementById('progress-note');
  const resultsEl = document.getElementById('results');

  function parseEmails(raw) {
    const pieces = raw.split(/[\n,;\s]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    const seen = new Set();
    const valid = [];
    const invalid = [];
    pieces.forEach(function (p) {
      const lower = p.toLowerCase();
      if (seen.has(lower)) return;
      seen.add(lower);
      if (cwdIsValidEmail(p)) valid.push(p); else invalid.push(p);
    });
    return { valid: valid, invalid: invalid };
  }

  function updateCounts() {
    const parsed = parseEmails(textarea.value);
    validCountEl.textContent = parsed.valid.length;
    invalidCountEl.textContent = parsed.invalid.length;
    invalidListEl.textContent = parsed.invalid.length ? 'Invalides : ' + parsed.invalid.join(', ') : '';
    return parsed;
  }

  textarea.addEventListener('input', updateCounts);
  updateCounts();

  function sleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  sponsorBtn.addEventListener('click', async function () {
    if (CWD_SPONSOR_TEMPLATE_ID === 'REPLACE_WITH_YOUR_SPONSOR_TEMPLATE_ID') {
      alert("Le template EmailJS n'est pas encore configuré — voir la note en haut de la page.");
      return;
    }

    const parsed = updateCounts();
    if (!parsed.valid.length) {
      alert('Aucun email valide à envoyer.');
      return;
    }
    if (!confirm('Envoyer un email de présentation à ' + parsed.valid.length + ' adresse(s) ?')) return;

    sponsorBtn.disabled = true;
    sponsorBtn.textContent = 'Envoi...';
    progressWrap.classList.add('show');
    resultsEl.innerHTML = '';
    const failed = [];
    let sent = 0;

    for (let i = 0; i < parsed.valid.length; i++) {
      const to = parsed.valid[i];
      try {
        await emailjs.send(CWD_EMAILJS_SERVICE_ID, CWD_SPONSOR_TEMPLATE_ID, {
          email: to,
          site_link: CWD_SITE_LINK
        });
        sent++;
      } catch (err) {
        console.error('cwd: erreur envoi sponsor ->', to, err);
        failed.push(to);
      }
      const pct = Math.round(((i + 1) / parsed.valid.length) * 100);
      progressFill.style.width = pct + '%';
      progressNote.textContent = (i + 1) + ' / ' + parsed.valid.length + ' traité(s)';
      if (i < parsed.valid.length - 1) await sleep(CWD_SEND_DELAY_MS);
    }

    sponsorBtn.disabled = false;
    sponsorBtn.textContent = 'Sponsor — Envoyer';
    progressNote.textContent = 'Terminé.';

    let html = '<span class="ok">' + sent + ' envoyé(s)</span>';
    if (failed.length) {
      html += ' · <span class="fail">' + failed.length + ' échoué(s)</span>' +
        '<div class="fail-list">' + failed.join(', ') + '</div>';
    }
    resultsEl.innerHTML = html;
  });
</script>

</body>
</html>
