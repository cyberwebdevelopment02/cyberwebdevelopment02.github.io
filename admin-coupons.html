<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons — Admin — Cyber Web Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2136;
    --ink-2:#132C46;
    --atlantic:#1C4870;
    --whitewash:#F6F4EE;
    --whitewash-2:#EEEAE0;
    --brass:#B8863C;
    --brass-light:#D9AE6B;
    --slate:#2B2F36;
    --mist:#C7D2DA;
    --line: rgba(246,244,238,0.14);
    --green:#2E7D46;
    --red:#B33A3A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ font-family:'Work Sans', sans-serif; background:var(--whitewash); color:var(--slate); min-height:100vh; }
  h1{ font-family:'Fraunces', serif; font-weight:500; letter-spacing:-0.01em; color:var(--ink); }
  a{ color:inherit; text-decoration:none; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--brass);
  }

  nav{
    position:sticky; top:0; z-index:50;
    background:rgba(14,33,54,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  nav .navwrap{
    max-width:1120px; margin:0 auto; padding:0 28px;
    display:flex; align-items:center; justify-content:space-between; height:68px; flex-wrap:wrap; gap:10px;
  }
  .logo{ font-family:'Fraunces', serif; font-size:1.15rem; color:var(--whitewash); font-weight:600; }
  .logo span{ color:var(--brass-light); }
  .admin-links{ display:flex; gap:24px; align-items:center; }
  .admin-links a{ color:var(--mist); font-size:0.88rem; transition:color .2s; }
  .admin-links a:hover{ color:var(--whitewash); }
  .admin-links a.active{ color:var(--brass-light); font-weight:600; }
  .back-link{ color:var(--mist); font-size:0.88rem; }
  .back-link:hover{ color:var(--whitewash); }

  main{ max-width:760px; margin:0 auto; padding:48px 28px 96px; }
  .page-head{ margin-bottom:32px; }
  .page-head h1{ font-size:1.6rem; margin-bottom:6px; }
  .subtitle{ color:#6b7076; font-size:0.94rem; }

  .fb-signin-box{
    max-width:380px; margin:60px auto; border:1px solid var(--whitewash-2); border-radius:8px;
    padding:32px; text-align:left; background:#fff;
  }
  .fb-signin-title{ font-family:'Fraunces', serif; font-weight:500; font-size:1.15rem; color:var(--ink); margin-bottom:6px; }
  .fb-signin-note{ color:#8a8f96; font-size:0.85rem; margin-bottom:18px; }
  .fb-signin-box input{
    width:100%; padding:12px 14px; margin-bottom:10px; border:1px solid #D9D4C6;
    border-radius:4px; font-size:0.94rem; font-family:'Work Sans',sans-serif;
  }
  .fb-signin-box input:focus{ outline:none; border-color:var(--brass); }
  .fb-signin-box button{
    width:100%; padding:12px; border:none; border-radius:4px; background:var(--brass);
    color:var(--ink); font-weight:600; cursor:pointer; font-size:0.94rem; transition:transform .15s ease;
  }
  .fb-signin-box button:hover{ transform:translateY(-2px); }
  .fb-signin-error{ color:var(--red); font-size:0.82rem; margin-top:8px; min-height:1em; }

  .generator{
    display:flex; gap:12px; align-items:flex-end; padding:22px; background:#fff; border:1px solid var(--whitewash-2);
    border-radius:6px; margin-bottom:32px; flex-wrap:wrap;
  }
  .generator .field{ display:flex; flex-direction:column; gap:6px; }
  .generator label{ font-size:0.82rem; font-weight:600; color:var(--ink); }
  .generator select{ padding:10px 12px; border:1px solid #D9D4C6; border-radius:4px; font-size:0.92rem; font-family:'Work Sans',sans-serif; }
  .generator button{
    padding:12px 24px; border:none; border-radius:4px; background:var(--brass); color:var(--ink);
    font-weight:600; cursor:pointer; font-size:0.92rem; transition:transform .15s ease;
  }
  .generator button:hover{ transform:translateY(-2px); }
  .generator button:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }
  .new-code-box{
    display:none; margin-bottom:32px; padding:18px 20px; background:var(--whitewash-2); border-radius:6px;
    border:1px solid var(--brass-light);
  }
  .new-code-box.show{ display:block; }
  .new-code-box .code{ font-family:'IBM Plex Mono',monospace; font-size:1.15rem; letter-spacing:0.05em; font-weight:600; color:var(--ink); }

  table{ width:100%; border-collapse:collapse; font-size:0.88rem; background:#fff; border:1px solid var(--whitewash-2); border-radius:6px; overflow:hidden; }
  th, td{ text-align:left; padding:12px 14px; border-bottom:1px solid var(--whitewash-2); }
  th{ color:#8a8f96; font-weight:600; font-size:0.74rem; text-transform:uppercase; letter-spacing:0.06em; font-family:'IBM Plex Mono',monospace; background:var(--whitewash); }
  td.code-cell{ font-family:'IBM Plex Mono',monospace; }
  .status-active{ color:var(--green); font-weight:600; }
  .status-used{ color:#8a8f96; }
  .empty-state, .error-state{ color:#8a8f96; font-size:0.92rem; padding:20px 14px; }
  .error-state{ color:var(--red); }

  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:18px; }
  .export-btn{
    padding:9px 18px; border:1px solid var(--whitewash-2); border-radius:4px; background:#fff;
    color:var(--ink); font-weight:600; font-size:0.86rem; cursor:pointer; transition:border-color .2s;
  }
  .export-btn:hover{ border-color:var(--brass); }
</style>
</head>
<body>

<nav>
  <div class="navwrap">
    <div class="logo">Cyber<span>Web</span> Development</div>
    <span class="admin-links">
      <a href="admin.html">Demandes</a>
      <a href="admin-coupons.html" class="active">Coupons</a>
      <a href="admin-utilisateurs.html">Utilisateurs</a>
      <a href="index.html" class="back-link">← Retour au site</a>
    </span>
  </div>
</nav>

<main>
  <div class="page-head">
    <span class="eyebrow">Admin</span>
    <h1>Coupons de réduction</h1>
    <p class="subtitle">Générez un code à 16 chiffres, valable une seule fois.</p>
  </div>
  <div class="toolbar">
    <button class="export-btn" id="export-csv-btn">Exporter en CSV</button>
  </div>
  <div id="coupons-root">
    <p class="empty-state">Chargement...</p>
  </div>
</main>

<script src="auth.js?v=5"></script>
<script>
  (function () {
    const email = cwdGetLoggedInEmail();
    if (!email) {
      window.location.href = 'login.html?redirect=admin-coupons.html';
      return;
    }
    if (!cwdIsAdmin()) {
      window.location.href = 'index.html';
      return;
    }
  })();
</script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin-firebase.js"></script>
<script>
  (async function () {
    const CWD_ADMIN_EMAIL = 'cyberweb.development02@gmail.com';
    const root = document.getElementById('coupons-root');

    const existingUser = await cwdFirebaseWaitForAuthState();
    if (!existingUser) {
      await cwdRenderFirebaseSignIn(root, CWD_ADMIN_EMAIL);
    }

    buildPage();

    function buildPage() {
      root.innerHTML =
        '<div class="generator">' +
          '<div class="field">' +
            '<label for="discount-select">Réduction</label>' +
            '<select id="discount-select">' +
              [10,15,20,25,30,35,40,45,50].map(function(p){ return '<option value="'+p+'">'+p+'%</option>'; }).join('') +
            '</select>' +
          '</div>' +
          '<button id="generate-btn">Générer un code</button>' +
        '</div>' +
        '<div class="new-code-box" id="new-code-box">' +
          'Nouveau code : <span class="code" id="new-code-value"></span> — <span id="new-code-percent"></span>% de réduction' +
        '</div>' +
        '<table>' +
          '<thead><tr><th>Code</th><th>Réduction</th><th>Statut</th><th>Créé le</th><th>Utilisé le</th></tr></thead>' +
          '<tbody id="coupons-tbody"></tbody>' +
        '</table>';

      document.getElementById('generate-btn').addEventListener('click', generateCoupon);
      document.getElementById('export-csv-btn').addEventListener('click', exportCsv);
      loadCoupons();
    }

    let loadedCoupons = []; // [{ id, data }]

    async function generateCoupon() {
      const btn = document.getElementById('generate-btn');
      const pct = parseInt(document.getElementById('discount-select').value, 10);
      btn.disabled = true;
      btn.textContent = 'Génération...';

      try {
        let code, taken = true;
        // 16 digits gives 10^16 possibilities — collision is astronomically
        // unlikely, but we still check rather than assume.
        while (taken) {
          code = cwdGenerateCouponCode();
          const existing = await cwdDb.collection('coupons').doc(code).get();
          taken = existing.exists;
        }

        await cwdDb.collection('coupons').doc(code).set({
          discount_percent: pct,
          used: false,
          created_at: firebase.firestore.FieldValue.serverTimestamp(),
          used_at: null
        });

        document.getElementById('new-code-value').textContent = code;
        document.getElementById('new-code-percent').textContent = pct;
        document.getElementById('new-code-box').classList.add('show');
        loadCoupons();
      } catch (err) {
        console.error('cwd: erreur génération coupon ->', err);
        alert('La génération a échoué — vérifiez la configuration Firebase.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Générer un code';
      }
    }

    function cwdGenerateCouponCode() {
      let code = '';
      for (let i = 0; i < 16; i++) code += Math.floor(Math.random() * 10);
      return code;
    }

    async function loadCoupons() {
      const tbody = document.getElementById('coupons-tbody');
      try {
        const snap = await cwdDb.collection('coupons').orderBy('created_at', 'desc').get();
        tbody.innerHTML = '';
        loadedCoupons = [];
        if (snap.empty) {
          tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Aucun coupon généré.</td></tr>';
          return;
        }
        snap.forEach(function (doc) {
          const d = doc.data();
          loadedCoupons.push({ id: doc.id, data: d });
          const created = d.created_at && d.created_at.toDate ? d.created_at.toDate().toLocaleDateString('fr-FR') : '—';
          const used = d.used_at && d.used_at.toDate ? d.used_at.toDate().toLocaleDateString('fr-FR') : '—';
          const tr = document.createElement('tr');
          tr.innerHTML =
            '<td class="code-cell">' + doc.id + '</td>' +
            '<td>' + d.discount_percent + '%</td>' +
            '<td class="' + (d.used ? 'status-used' : 'status-active') + '">' + (d.used ? 'Utilisé' : 'Actif') + '</td>' +
            '<td>' + created + '</td>' +
            '<td>' + used + '</td>';
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('cwd: erreur chargement coupons ->', err);
        tbody.innerHTML = '<tr><td colspan="5" class="error-state">Impossible de charger les coupons.</td></tr>';
      }
    }

    function exportCsv() {
      if (!loadedCoupons.length) { alert('Aucun coupon à exporter.'); return; }
      const rows = [['code', 'reduction_percent', 'statut', 'cree_le', 'utilise_le']];
      loadedCoupons.forEach(function (entry) {
        const d = entry.data;
        const created = d.created_at && d.created_at.toDate ? d.created_at.toDate().toLocaleString('fr-FR') : '';
        const used = d.used_at && d.used_at.toDate ? d.used_at.toDate().toLocaleString('fr-FR') : '';
        rows.push([entry.id, d.discount_percent, d.used ? 'Utilisé' : 'Actif', created, used]);
      });
      const csv = rows.map(function (row) { return row.map(csvEscape).join(','); }).join('\r\n');
      downloadFile('coupons-' + new Date().toISOString().slice(0, 10) + '.csv', csv);
    }

    function csvEscape(val) {
      const s = String(val == null ? '' : val);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    function downloadFile(filename, content) {
      const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  })();
</script>

</body>
</html>
